<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Google Calendar 接入小 Demo</title>
  <style>
    body { font-family: sans-serif; max-width: 720px; margin: 40px auto; line-height: 1.6; }
    input, button { padding: 8px 12px; margin: 4px; }
    .event-row { display: flex; justify-content: space-between; border-bottom: 1px solid #ddd; padding: 8px 0; }
  </style>
</head>
<body>
  <h1>Google Calendar 小 Demo</h1>
  <p><a href="/auth/login"><button>1. 连接 Google Calendar</button></a></p>

  <h2>2. 新增日程</h2>
  <input id="summary" placeholder="日程标题，例如：交周报" />
  <input id="startIso" type="datetime-local" size="26" />
  <input id="endIso" type="datetime-local" size="26" />
  <button onclick="addEvent()">添加</button>

  <h2>3. 日程列表</h2>
  <button onclick="loadEvents()">刷新日程</button>
  <div id="events"></div>

  <script>
    async function loadEvents() {
      const res = await fetch("/api/events");
      const box = document.getElementById("events");
      if (!res.ok) {
        const error = await res.json().catch(() => ({}));
        box.innerHTML = `<p>${error.detail || "请先点击上方“连接 Google Calendar”完成授权。"}</p>`;
        return;
      }
      const data = await res.json();
      box.innerHTML = data.map(ev => `
        <div class="event-row">
          <div><strong>${escapeHtml(ev.summary)}</strong><br/><small>${escapeHtml(ev.start)} ~ ${escapeHtml(ev.end)}</small><br/><small>ID: ${escapeHtml(ev.id)}</small></div>
          <div>
            <button data-event-id="${escapeHtml(ev.id)}" data-summary="${escapeHtml(ev.summary)}" onclick="updateEvent(this.dataset.eventId, this.dataset.summary)">修改标题</button>
            <button data-event-id="${escapeHtml(ev.id)}" onclick="removeEvent(this.dataset.eventId)">删除</button>
          </div>
        </div>
      `).join("") || "<p>暂无日程</p>";
    }

    async function addEvent() {
      const summary = document.getElementById("summary").value.trim();
      const startValue = document.getElementById("startIso").value;
      const endValue = document.getElementById("endIso").value;
      if (!summary || !startValue || !endValue) return alert("请填写标题、开始和结束时间");
      const start_iso = new Date(startValue).toISOString();
      const end_iso = new Date(endValue).toISOString();

      const res = await fetch("/api/events", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ summary, start_iso, end_iso })
      });
      if (res.ok) {
        document.getElementById("summary").value = "";
        loadEvents();
      } else {
        const error = await res.json().catch(() => ({}));
        alert(error.detail || "创建失败，请检查授权和时间格式");
      }
    }

    async function removeEvent(id) {
      const res = await fetch(`/api/events/${encodeURIComponent(id)}`, { method: "DELETE" });
      if (res.ok) loadEvents();
      else {
        const error = await res.json().catch(() => ({}));
        alert(error.detail || "删除失败");
      }
    }

    async function updateEvent(id, currentSummary) {
      const summary = prompt("请输入新的日程标题", currentSummary);
      if (summary === null || !summary.trim()) return;
      const res = await fetch(`/api/events/${encodeURIComponent(id)}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ summary: summary.trim() })
      });
      if (res.ok) loadEvents();
      else {
        const error = await res.json().catch(() => ({}));
        alert(error.detail || "修改失败");
      }
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[char]);
    }

    const now = new Date();
    now.setHours(now.getHours() + 1, 0, 0, 0);
    const later = new Date(now.getTime() + 30 * 60 * 1000);
    const toLocalInput = date => new Date(date.getTime() - date.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
    document.getElementById("startIso").value = toLocalInput(now);
    document.getElementById("endIso").value = toLocalInput(later);
    loadEvents();
  </script>
</body>
</html>
