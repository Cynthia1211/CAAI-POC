name: Backend API Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-contract-tests:
    name: Cypress Backend Contract Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run Cypress API tests
        uses: cypress-io/github-action@v7
        env:
          AWS_EC2_METADATA_DISABLED: "true"
        with:
          start: python -m uvicorn main:app --host 127.0.0.1 --port 8000
          wait-on: http://127.0.0.1:8000/openapi.json
          wait-on-timeout: 120
          browser: chrome
          spec: cypress/e2e/backend-contract.cy.js
